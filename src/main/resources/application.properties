spring.application.name=newelog-ranking-service
server.port=${PORT:8083}
app.jwt.secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
motoristas.url=${MOTORISTAS_SERVICE_URL:http://localhost:8080}
motoristas.connect-timeout-ms=${MOTORISTAS_CONNECT_TIMEOUT_MS:5000}
motoristas.read-timeout-ms=${MOTORISTAS_READ_TIMEOUT_MS:30000}
management.endpoints.web.exposure.include=health,info
ranking.limitacao.max-viagens-por-mes=${RANKING_MAX_VIAGENS:20}
# Fator provisório: o cliente ainda vai definir o valor real
ranking.valorizacao.fator-sao-paulo=${RANKING_FATOR_SP:1.20}